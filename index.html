<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
        crossorigin="anonymous">
</head>
<body>
    <div>
      <button>MC</button>
      <button>MR</button>
      <button>M+</button>
      <button>M-</button>
      <button>MS</button>
    </div>
    <section class="row no-gutters mb-1">
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block" disabled>MC</button></div>
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block" disabled>MR</button></div>
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block">M+</button></div>
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block">M-</button></div>
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block">MS</button></div>
      <div class="col-2"><button type="button" class="btn btn-link text-light btn-sm btn-block" disabled>M▾</button></div>
    </section>

    <section class="row no-gutters">
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">%</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">CE</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">C</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">⌫</button></div>

      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">1/x</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">x²</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">²√x</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">÷</button></div>

      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">7</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">8</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">9</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">×</button></div>

      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">4</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">5</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">6</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">−</button></div>

      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">1</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">2</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">3</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-secondary btn-block py-3">+</button></div>

      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3">+/−</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">0</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-dark border border-secondary btn-block py-3 font-weight-bold">.</button></div>
      <div class="col-3 p-1"><button type="button" class="btn btn-info btn-block py-3 font-weight-bold">=</button></div>
    </section>
</body>
</html>
